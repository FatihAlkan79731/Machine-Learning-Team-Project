[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uarps"
version = "0.1.0"
description = "Urban Accident Risk Prediction System - Machine Learning Team Project"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Fatih Alkan" },
  { name = "Denzel Blessing Sibanda" },
  { name = "Solomon Mbedzi" },
  { name = "Helin Agze Gulec" },
  { name = "Furkan Cokpinar" },
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "requests>=2.31",
  "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
